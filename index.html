<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piscis Modelo 1 — Iniciar sesión</title>
<link rel="icon" type="image/png" href="assets/imagenes/favicon/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --ink: #14181A;
    --ink-soft: #6B7178;
    --hairline: #E4E1DA;
    --accent: #1F8A85;
    --accent-soft: #E4F1F0;
    --error: #C1443A;
  }
  html.dark{
    --bg: #0F1315;
    --surface: #14191B;
    --ink: #F2F1EC;
    --ink-soft: #8B9096;
    --hairline: #262C2E;
    --accent: #4FC3BD;
    --accent-soft: #16302E;
    --error: #E27367;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
    display:flex;
    flex-direction: column;
  }
  .wrap{ max-width: 920px; margin: 0 auto; padding: 0 28px; width:100%; }

  /* ---------- NAV ---------- */
  header{ padding: 28px 0; }
  .nav-row{ display:flex; align-items:center; justify-content:space-between; }
  .logo{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: -.01em;
  }
  .logo b{ color: var(--accent); font-weight:600; }
  #darkToggle{
    background:none; border:none; cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing:.05em;
    color: var(--ink-soft); text-transform:uppercase;
    padding: 6px 0; border-bottom: 1px solid transparent;
  }
  #darkToggle:hover{ color: var(--ink); border-bottom-color: var(--ink-soft); }
  #darkToggle:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---------- MAIN ---------- */
  main{ flex:1; display:flex; align-items:center; }
  .login-col{ max-width: 380px; margin: 0 auto; width:100%; padding: 40px 0 60px; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px; text-transform: uppercase; letter-spacing:.12em;
    color: var(--accent); margin-bottom: 16px;
  }
  h1{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight: 500;
    letter-spacing: -.02em;
    font-size: 32px;
    margin: 0 0 8px;
  }
  .lead{
    font-size: 14.5px; color: var(--ink-soft); line-height: 1.6;
    margin: 0 0 36px;
  }

  form{ margin: 0; }
  .field{ margin-bottom: 22px; }
  .field label{
    display:block; font-family:'IBM Plex Mono', monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing:.08em;
    color: var(--ink-soft); margin-bottom: 8px;
  }
  .field input{
    width:100%; border: none; border-bottom: 1px solid var(--hairline);
    background: transparent; color: var(--ink);
    font-family:'Inter', sans-serif; font-size: 15px;
    padding: 9px 0;
  }
  .field input:focus{ border-bottom-color: var(--accent); }
  .field input::placeholder{ color: var(--ink-soft); opacity: .55; }

  .field-note{
    display:flex; justify-content: flex-end; margin-top: -10px; margin-bottom: 22px;
    font-size: 12.5px; color: var(--ink-soft); text-align: right;
  }
  .field-note{
    font-size: 12.5px; color: var(--ink-soft); text-decoration:none; border-bottom: 1px solid var(--hairline);
  }
  .field-note a{ color:var(--ink-soft); text-decoration:none; }
  .field-note a:hover{ color:var(--accent); }

  .error-msg{
    display:none;
    font-size: 13px; color: var(--error);
    margin: -6px 0 20px;
    font-family:'IBM Plex Mono', monospace;
  }
  .error-msg.show{ display:block; }
  .error-msg.success{ color: var(--accent); }

  .submit-btn{
    width:100%;
    background: var(--ink); color: var(--bg); border:none;
    font-family:'Inter', sans-serif;
    font-size: 14px; font-weight:500; padding: 13px 0; cursor:pointer;
    border-radius: 2px;
  }
  html.dark .submit-btn{ background: var(--accent); color:#0F1315; }
  .submit-btn:hover{ opacity:.88; }

  .signup-note{
    text-align:center; font-size: 13.5px; color: var(--ink-soft);
  }
  .signup-note a{ color: var(--ink); border-bottom: 1px solid var(--ink); text-decoration:none; }
  .signup-note a:hover{ color: var(--accent); border-bottom-color: var(--accent); }

  /* horizon signature */
  .horizon{
    display:flex; align-items:center; gap: 10px;
    margin: 44px 0 0;
  }
  .horizon .line{ flex:1; height:1px; background: var(--hairline); }
  .horizon .dot{ width:5px; height:5px; border-radius:50%; background: var(--accent); flex-shrink:0; }
  .horizon .dot:nth-child(2){ opacity:.75; }
  .horizon .dot:nth-child(4){ opacity:.5; }
  .horizon .dot:nth-child(6){ opacity:.3; }

  footer{ padding: 24px 0 40px; }
  footer p{ font-size: 12px; color: var(--ink-soft); margin: 16px 0 0; text-align:center; }

  @media (max-width: 480px){
    .login-col{ padding: 20px 0 40px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav-row">
    <div class="logo">Oceano<b>tech</b></div>
    <button id="darkToggle">Modo noche</button>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="login-col">
      <div class="eyebrow">Piscis Modelo 1 — Acceso privado</div>
      <h1>Iniciar sesión</h1>
      <p class="lead">Ingresa tus credenciales para iniciar sesión en Piscis Modelo 1.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tu@oceanotech.com" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <div class="field-note">
          <a href="reset-password.html">¿Olvidaste tu contraseña?</a>
        </div>

        <p class="error-msg" id="errorMsg" role="status" aria-live="polite"></p>

        <button type="submit" class="submit-btn" id="submitBtn">Entrar</button>
      </form>

      <p class="signup-note" style="margin-top:1.2rem;">El acceso es administrado por el equipo.</p>

      <div class="horizon">
        <div class="dot"></div><div class="line"></div>
        <div class="dot"></div><div class="line"></div>
        <div class="dot"></div><div class="line"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <p>Oceanotech — acceso restringido al equipo.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" defer></script>
<script src="auth-client.js" defer></script>
<script src="auth-flows.js" defer></script>
<script src="login.js" defer></script>
</body>
</html>
